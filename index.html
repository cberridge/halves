<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Halves</title>
  <meta name="description" content="Split bills between two people.">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1412" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Halves">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="center muted">Loading…</div>
  </main>

  <!-- Add / edit expense -->
  <dialog id="entry-sheet" class="sheet" aria-labelledby="entry-title">
    <form id="entry-form" novalidate>
      <header class="sheet-head">
        <button type="button" class="link" data-close>Cancel</button>
        <h2 id="entry-title">Add expense</h2>
        <button type="submit" class="link strong">Save</button>
      </header>

      <label class="field">
        <span>What for?</span>
        <input name="description" maxlength="120" autocomplete="off" placeholder="e.g. Groceries" required>
      </label>

      <div class="row-2">
        <label class="field">
          <span>Amount</span>
          <span class="money-input"><span aria-hidden="true">£</span><input name="amount" inputmode="decimal" placeholder="0.00" autocomplete="off" required></span>
        </label>
        <label class="field">
          <span>Date</span>
          <input name="date" type="date" required>
        </label>
      </div>

      <fieldset class="field">
        <legend>Paid by</legend>
        <div class="seg" id="paid-by"></div>
      </fieldset>

      <fieldset class="field">
        <legend>Split</legend>
        <div class="seg">
          <label><input type="radio" name="splitType" value="equal" checked><span>50 / 50</span></label>
          <label><input type="radio" name="splitType" value="percent"><span>By %</span></label>
          <label><input type="radio" name="splitType" value="exact"><span>Exact £</span></label>
        </div>
        <label class="field sub" id="split-detail" hidden>
          <span id="split-detail-label">Your share</span>
          <input name="splitValue" inputmode="decimal" autocomplete="off">
        </label>
        <p class="preview" id="split-preview"></p>
      </fieldset>

      <p class="error" id="entry-error" role="alert"></p>
      <button type="button" class="btn danger wide" id="delete-entry" hidden>Delete expense</button>
    </form>
  </dialog>

  <!-- Settle up -->
  <dialog id="settle-sheet" class="sheet" aria-labelledby="settle-title">
    <form id="settle-form" novalidate>
      <header class="sheet-head">
        <button type="button" class="link" data-close>Cancel</button>
        <h2 id="settle-title">Settle up</h2>
        <button type="submit" class="link strong">Save</button>
      </header>
      <fieldset class="field">
        <legend>Who paid?</legend>
        <div class="seg" id="settle-direction"></div>
      </fieldset>
      <div class="row-2">
        <label class="field">
          <span>Amount</span>
          <span class="money-input"><span aria-hidden="true">£</span><input name="amount" inputmode="decimal" placeholder="0.00" autocomplete="off" required></span>
        </label>
        <label class="field">
          <span>Date</span>
          <input name="date" type="date" required>
        </label>
      </div>
      <p class="muted small">This records a payment you've made outside the app, e.g. a bank transfer.</p>
      <p class="error" id="settle-error" role="alert"></p>
      <button type="button" class="btn danger wide" id="delete-settlement" hidden>Delete payment</button>
    </form>
  </dialog>

  <!-- Menu -->
  <dialog id="menu-sheet" class="sheet" aria-labelledby="menu-title">
    <div>
      <header class="sheet-head">
        <span></span>
        <h2 id="menu-title">Settings</h2>
        <button type="button" class="link strong" data-close>Done</button>
      </header>
      <div id="menu-body"></div>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
